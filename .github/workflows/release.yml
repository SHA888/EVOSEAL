name: Release

# Only allow one deployment to run at a time
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  # Trigger when CI workflow completes successfully on main or release/* branches
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    branches: [main, 'release/*']
    types: [completed]

  # Manual trigger from GitHub UI/API
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3)'
        required: false
        default: 'patch'  # Can be 'major', 'minor', 'patch', or specific version
      publish:
        description: 'Publish to package registry?'
        required: false
        default: 'true'

  # Trigger when version tags are pushed (manual releases)
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # Only match proper version tags


# Environment variables available to all jobs
env:
  PYTHON_VERSION: '3.11'

jobs:
  release:
    # Only run for successful workflow runs or manual triggers
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        startsWith(github.event.workflow_run.head_branch, 'release/'))) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))

    # Use the production environment for protection
    environment: production

    # Required permissions
    permissions:
      contents: write  # For creating releases and tags
      id-token: write  # For OIDC token for package publishing
      actions: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Needed for git history
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install build dependencies
        run: uv pip install --system build twine tomli tomli-w pyyaml

      # -----------------------------------------------------------------------
      # Determine the version.  For tag pushes the version comes from the tag;
      # for workflow_dispatch the user may supply a bump type or specific value;
      # for workflow_run we default to a patch bump.
      # -----------------------------------------------------------------------
      - name: Determine version
        id: version
        run: |
          set -euo pipefail

          CURRENT=$(python3 -c "import tomli; print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")

          if [[ "${{ github.event_name }}" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            # Tag push: use the tag version
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            INPUT="${{ github.event.inputs.version }}"
            if [[ "$INPUT" =~ ^(major|minor|patch)$ ]]; then
              python3 scripts/lib/version/version.py bump "$INPUT" --no-commit
              VERSION=$(python3 -c "import tomli; print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")
            else
              python3 scripts/lib/version/version.py update "$INPUT" --no-commit
              VERSION="$INPUT"
            fi
          else
            # workflow_run or default: bump patch
            python3 scripts/lib/version/version.py bump patch --no-commit
            VERSION=$(python3 -c "import tomli; print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")
          fi

          # Verify semver format
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+)?$ ]]; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "✅ Version: $CURRENT → $VERSION"

      # -----------------------------------------------------------------------
      # Build the package
      # -----------------------------------------------------------------------
      - name: Build package
        run: |
          rm -rf build/ dist/
          python3 -m build
          ls -la dist/

      # -----------------------------------------------------------------------
      # Generate / verify release notes
      # -----------------------------------------------------------------------
      - name: Generate release notes
        id: release_notes
        run: |
          set -euo pipefail
          NOTES_PATH="releases/${{ steps.version.outputs.version }}/RELEASE_NOTES.md"

          # If a pre-existing release notes file is present, keep it
          if [ -f "$NOTES_PATH" ]; then
            echo "ℹ️  Using existing $NOTES_PATH"
          else
            python3 scripts/auto_generate_release_notes.py "${{ steps.version.outputs.version }}" --output-dir releases
          fi

          echo "notes_path=$NOTES_PATH" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Commit the version bump back to the source branch so that
      # pyproject.toml / CHANGELOG.md stay in sync with the release.
      # Skipped for tag-push (the commit is already the tagged one).
      # -----------------------------------------------------------------------
      - name: Commit version bump
        if: github.event_name != 'push'
        run: |
          set -euo pipefail

          # Only commit if there are actual changes
          if git diff --quiet; then
            echo "ℹ️  No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD
          echo "✅ Committed and pushed version v${{ steps.version.outputs.version }}"

      # -----------------------------------------------------------------------
      # Publish to PyPI (tag push or explicit workflow_dispatch with publish=true)
      # -----------------------------------------------------------------------
      - name: Publish to PyPI
        if: >
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "📦 Publishing version ${{ steps.version.outputs.version }} to PyPI..."

          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error::PYPI_API_TOKEN secret is not set"
            exit 1
          fi

          twine upload --non-interactive dist/*
          echo "✅ Successfully published to PyPI"

      # -----------------------------------------------------------------------
      # Create GitHub Release
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "v${{ steps.version.outputs.version }}"
          body_path: ${{ steps.release_notes.outputs.notes_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
            releases/${{ steps.version.outputs.version }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Distribution
        uses: actions/upload-artifact@v7
        with:
          name: distribution-${{ steps.version.outputs.version }}
          path: dist/*
